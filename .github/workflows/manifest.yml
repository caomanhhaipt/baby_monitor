# Tự sinh lại data/manifest.txt mỗi khi có file dữ liệu mới được push,
# để trang web liệt kê được thư mục data/ mà không cần gọi GitHub API.
name: Cập nhật manifest

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/manifest.yml"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sinh data/manifest.txt
        run: |
          cd data
          ls -1 *.txt | grep -vix 'manifest\.txt' > manifest.txt
          cat manifest.txt

      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Cập nhật manifest.txt tự động"
            git push
          fi
